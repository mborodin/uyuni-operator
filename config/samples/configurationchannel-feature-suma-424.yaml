---
# ConfigurationChannel: Feature Branch - SUMA-424 Rancher Dev
# Syncs files from feature/suma-424-rancher_dev branch
# Updates every 2 minutes for rapid development testing
apiVersion: uyuni.uyuni-project.org/v1alpha1
kind: ConfigurationChannel
metadata:
  name: feature-suma-424-baseline
  namespace: brand
spec:
  id: feature-suma-424-baseline
  name: "Feature SUMA-424 Baseline Configuration"
  type: state
  description: "Salt state channel for SUMA-424 Rancher development branch"
  url: https://github.com/RoyalAholdDelhaize/becse-ngp-lom-nexa-platform
  repositoryType: git
  autoSync: true
  repositoryRef: feature/suma-424-rancher_dev    # Feature branch
  repositoryPath: salt/baseline                  # Directory to sync
  syncSchedule: "every 2m"                      # Every 2 minutes

---
