---
# Usage Instructions:
#
# 1. Apply this configuration:
#    kubectl apply -f config/samples/configurationchannel-feature-suma-424.yaml
#
# 2. Watch sync progress:
#    kubectl get configurationchannels -n uyuni-operator-system -w
#
# 3. Check detailed status:
#    kubectl describe configurationchannel feature-suma-424-baseline -n uyuni-operator-system
#
# 4. View operator logs:
#    kubectl logs -n uyuni-operator-system deployment/uyuni-operator-controller-manager -f
#
# 5. Check sync every 2 minutes:
#    - First sync happens immediately on creation
#    - Next syncs every 2 minutes (every 2m)
#    - Check lastSyncTime in status to see last sync
#
# 6. Verify in Uyuni:
#    - Log into Uyuni server
#    - Configuration → Configuration Channels
#    - Find "Feature SUMA-424 Baseline Configuration"
#    - View Configuration Files to see all synced files
#
# Branch: feature/suma-424-rancher_dev
# Repository: https://github.com/RoyalAholdDelhaize/becse-ngp-lom-nexa-platform
# Synced Path: salt/baseline
# Sync Frequency: Every 2 minutes (every 2m)
