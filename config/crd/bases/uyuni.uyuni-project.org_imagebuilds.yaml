---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: imagebuilds.uyuni.uyuni-project.org
spec:
  group: uyuni.uyuni-project.org
  names:
    kind: ImageBuild
    listKind: ImageBuildList
    plural: imagebuilds
    singular: imagebuild
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profileRef.name
      name: Profile
      type: string
    - jsonPath: .status.name
      name: Image
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .status.revision
      name: Rev
      type: integer
    - jsonPath: .status.buildStatus
      name: Status
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              buildHostRef:
                description: BuildHostRef overrides the ImageProfile's buildHostRef
                  for this specific build.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              earliest:
                description: Earliest is the optional earliest time at which Uyuni
                  will start the build action.
                format: date-time
                type: string
              profileRef:
                description: ProfileRef references the ImageProfile CR. Immutable
                  after the first build is scheduled.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              timeoutMinutes:
                description: |-
                  TimeoutMinutes fails the build if it has not completed within this many
                  minutes. This is a backstop: Uyuni's image API surfaces only
                  successfully-built images (a failed or aborted build never appears in
                  image.listImages), and the schedule API that would report the action's
                  failure requires roles the build user often lacks — so without a timeout a
                  failed build would poll forever. Defaults to 120.
                minimum: 1
                type: integer
              version:
                description: |-
                  Version is the image tag to apply to this build.
                  Auto-generated as "YYYYMMDD-HHMM" when empty.
                type: string
            required:
            - profileRef
            type: object
          status:
            properties:
              actionId:
                description: ActionID is the Uyuni action ID returned by ScheduleImageBuild.
                type: integer
              baselineImageId:
                description: |-
                  BaselineImageID is the highest Uyuni image id that existed when this build
                  was scheduled. The build's own image record is the first one created above
                  it, letting us identify this build's image without a per-profile filter
                  (image.listImages has none) or relying on the version (kiwi sets the built
                  image's version, not the tag we pass).
                type: integer
              buildStatus:
                description: BuildStatus is the current build state.
                enum:
                - Scheduled
                - Running
                - Succeeded
                - Failed
                type: string
              checksum:
                description: Checksum is the built image's checksum.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              files:
                description: |-
                  Files are the artifacts produced by this specific build (image, kernel,
                  initrd, ...), each with a download URL. Because an ImageBuild is an
                  immutable record of one build, referencing it (rather than the
                  ImageProfile's mutable lastBuild) pins a specific version's artifacts.
                items:
                  description: ImageFile is one artifact of a built image.
                  properties:
                    name:
                      description: Name is the file's path within the image store.
                      type: string
                    type:
                      description: 'Type is the artifact kind: image, kernel, initrd,
                        ...'
                      type: string
                    url:
                      description: URL is the downloadable URL.
                      type: string
                  type: object
                type: array
              imageId:
                description: ImageID is the Uyuni image record ID after the build
                  completes successfully.
                type: integer
              imageUrl:
                description: |-
                  ImageURL is the URL of the file whose type is "image" (the installable
                  image tarball), or empty if none.
                type: string
              name:
                description: Name is the built image's name (image.getDetails), as
                  shown in the Uyuni UI.
                type: string
              observedGeneration:
                format: int64
                type: integer
              revision:
                description: Revision is the built image's revision number (image.getDetails).
                type: integer
              startedAt:
                description: StartedAt is when the build was scheduled. Used for the
                  timeout backstop.
                format: date-time
                type: string
              version:
                description: Version records the version string actually used when
                  the build was scheduled.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
