---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: cobblersystems.uyuni.uyuni-project.org
spec:
  group: uyuni.uyuni-project.org
  names:
    kind: CobblerSystem
    listKind: CobblerSystemList
    plural: cobblersystems
    singular: cobblersystem
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.name
      name: CobblerName
      type: string
    - jsonPath: .status.profileName
      name: Profile
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              autoinstallMeta:
                additionalProperties:
                  type: string
                description: |-
                  AutoinstallMeta are the Cobbler autoinstall metadata (ks_meta) variables
                  set on the system record. Create mode. system.setVariables-equivalent.
                type: object
              comment:
                description: Comment is a free-text comment on the record. Create
                  mode.
                type: string
              interfaces:
                description: |-
                  Interfaces are the system's network interfaces (create mode). Named
                  interfaces are set via Cobbler's modify_interface (macaddress-<name>, ...).
                items:
                  description: CobblerInterface is one network interface of a Cobbler
                    system record.
                  properties:
                    dnsName:
                      type: string
                    ipAddress:
                      type: string
                    macAddress:
                      pattern: ^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$
                      type: string
                    name:
                      description: Name is the interface name (e.g. "eth0").
                      type: string
                  required:
                  - name
                  type: object
                type: array
              mode:
                default: import
                description: "CobblerMode selects how the operator manages a Cobbler
                  object.\n\n\tcreate: the operator creates and reconciles the object
                  in Cobbler.\n\timport: the operator only observes an object created
                  elsewhere (e.g. by a\n\t        Uyuni image build). It never creates
                  or mutates it; it waits for the\n\t        object to appear, then
                  reflects it in status and becomes Ready."
                enum:
                - create
                - import
                type: string
              name:
                description: |-
                  Name is the Cobbler system record name (Uyuni uses "<fqdn>:<orgId>").
                  Immutable after creation.
                type: string
              netbootEnabled:
                default: true
                description: NetbootEnabled toggles PXE netboot on the record. Defaults
                  to true. Create mode.
                type: boolean
              profileName:
                description: |-
                  ProfileName is the Cobbler profile the system boots (create mode).
                  Mutually exclusive with ProfileRef.
                type: string
              profileRef:
                description: ProfileRef references a CobblerProfile in the same namespace
                  (create mode).
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              providerRef:
                description: |-
                  LocalObjectRef is a name-only reference to a CR in the same namespace.
                  We deliberately don't include namespace or kind: cross-namespace refs
                  complicate RBAC and aren't needed in our model, and each ref's kind is
                  implied by the field where it appears.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              server:
                description: |-
                  Server is the Cobbler "server override" (e.g. a proxy the system boots
                  through). Create mode.
                type: string
            required:
            - name
            type: object
          status:
            properties:
              cobblerId:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              found:
                type: boolean
              observedGeneration:
                format: int64
                type: integer
              profileName:
                description: ProfileName is the observed profile the system is bound
                  to.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
