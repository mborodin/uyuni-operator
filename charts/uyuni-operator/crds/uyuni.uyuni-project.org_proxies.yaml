---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: proxies.uyuni.uyuni-project.org
spec:
  group: uyuni.uyuni-project.org
  names:
    kind: Proxy
    listKind: ProxyList
    plural: proxies
    singular: proxy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.fqdn
      name: FQDN
      type: string
    - jsonPath: .spec.parentServer
      name: Server
      type: string
    - jsonPath: .status.secretName
      name: Secret
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProxySpec is the declarative configuration for a Uyuni containerized
              proxy. The operator calls proxy.containerConfig to generate the proxy's
              config archive (tar.gz) and stores the extracted files in an owned Secret
              named in status.
            properties:
              email:
                description: Email is the proxy administrator's email, embedded in
                  the generated config.
                type: string
              fqdn:
                description: |-
                  FQDN is the proxy's own fully-qualified domain name. Immutable — it is
                  the proxy's identity; changing it would produce an unrelated
                  configuration.
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              maxCacheMB:
                default: 102400
                description: MaxCacheMB is the maximum squid cache size in megabytes.
                minimum: 0
                type: integer
              parentServer:
                description: |-
                  ParentServer is the FQDN of the server the proxy connects to. When empty
                  the operator uses the UyuniProvider's server host.
                type: string
              providerRef:
                description: |-
                  ProviderRef selects the UyuniProvider whose server generates the proxy
                  configuration.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              sshPort:
                default: 8022
                description: |-
                  SSHPort is the SSH port the proxy listens on for the server push
                  tunnel.
                maximum: 65535
                minimum: 1
                type: integer
              tlsSecretRef:
                description: |-
                  TLSSecretRef references a kubernetes.io/tls Secret in the same namespace
                  holding the proxy certificate. Expected keys: tls.crt, tls.key, ca.crt,
                  and an optional ca-intermediate.crt (PEM bundle) for intermediate CAs.
                  When unset, the server reuses its own certificate.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
            required:
            - fqdn
            - providerRef
            type: object
          status:
            description: ProxyStatus records the generated proxy configuration.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              config:
                description: |-
                  Config inlines the contents of the non-sensitive archive members only
                  (e.g. config.yaml). Never contains certificate keys or SSH private keys.
                type: string
              files:
                description: Files lists the archive member names (sorted) present
                  in the Secret.
                items:
                  type: string
                type: array
              generatedAt:
                description: GeneratedAt is when the current archive was generated.
                format: date-time
                type: string
              inputHash:
                description: |-
                  InputHash is a hash of the resolved generation inputs. Regeneration
                  (which rotates the proxy SSH keypair) happens only when this changes or
                  the regenerate annotation is set — not on every reconcile.
                type: string
              observedGeneration:
                format: int64
                type: integer
              secretName:
                description: |-
                  SecretName is the operator-owned Secret holding the extracted archive
                  files (one key per archive member). Deleted with the Proxy via GC.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
