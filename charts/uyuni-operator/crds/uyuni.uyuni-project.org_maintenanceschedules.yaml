---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: maintenanceschedules.uyuni.uyuni-project.org
spec:
  group: uyuni.uyuni-project.org
  names:
    kind: MaintenanceSchedule
    listKind: MaintenanceScheduleList
    plural: maintenanceschedules
    singular: maintenanceschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.calendarRef.name
      name: Calendar
      type: string
    - jsonPath: .status.resolvedSystemIds
      name: Systems
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MaintenanceScheduleSpec defines a Uyuni maintenance schedule
              (maintenance.createSchedule / updateSchedule / assignScheduleToSystems):
              which systems/groups a set of maintenance-window rules applies to.

              CalendarRef is optional. When set, the schedule inherits the referenced
              MaintenanceCalendar's recurring windows and Uyuni restricts scheduled
              actions on assigned systems to those windows. When left empty, the
              schedule carries no calendar at all — Uyuni imposes no time restriction,
              which is the mechanism for stores that run 24/7 with no dedicated
              maintenance window.
            properties:
              calendarRef:
                description: |-
                  CalendarRef references a MaintenanceCalendar in the same namespace.
                  Omit it for a schedule with no time restriction (24/7 stores).
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              name:
                description: |-
                  Name is the maintenance schedule name in Uyuni. Immutable after
                  creation — it is the schedule's identity (not part of Uyuni's
                  updateSchedule details struct).
                pattern: ^[a-zA-Z0-9._-]+$
                type: string
              organizationRef:
                description: |-
                  LocalObjectRef is a name-only reference to a CR in the same namespace.
                  We deliberately don't include namespace or kind: cross-namespace refs
                  complicate RBAC and aren't needed in our model, and each ref's kind is
                  implied by the field where it appears.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              rescheduleStrategy:
                default: Cancel
                description: |-
                  RescheduleStrategy controls what happens to actions that fall outside
                  the schedule's windows when it is updated or systems are
                  assigned/retracted: Cancel drops the now-out-of-window actions; Fail
                  rejects the operation and leaves the assignment untouched.
                enum:
                - Cancel
                - Fail
                type: string
              systemGroupRefs:
                description: |-
                  SystemGroupRefs are SystemGroup CRs in the same namespace whose
                  members are assigned this schedule. Uyuni has no group-native
                  assignment call, so the reconciler expands membership to individual
                  system IDs. Only meaningful with type: Multi.
                items:
                  description: |-
                    LocalObjectRef is a name-only reference to a CR in the same namespace.
                    We deliberately don't include namespace or kind: cross-namespace refs
                    complicate RBAC and aren't needed in our model, and each ref's kind is
                    implied by the field where it appears.
                  properties:
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              systemRefs:
                description: |-
                  SystemRefs are System CRs in the same namespace to assign this
                  schedule to.
                items:
                  description: |-
                    LocalObjectRef is a name-only reference to a CR in the same namespace.
                    We deliberately don't include namespace or kind: cross-namespace refs
                    complicate RBAC and aren't needed in our model, and each ref's kind is
                    implied by the field where it appears.
                  properties:
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              type:
                description: |-
                  Type is "Single" (the schedule may be assigned to at most one system,
                  no groups) or "Multi" (any number of systems and/or groups). Mutable:
                  Uyuni's updateSchedule accepts a new type.
                enum:
                - Single
                - Multi
                type: string
            required:
            - name
            - organizationRef
            - type
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              resolvedSystemIds:
                description: |-
                  ResolvedSystemIDs is the flattened set of Uyuni server IDs currently
                  assigned to this schedule (direct SystemRefs plus SystemGroupRefs
                  membership expanded). Used to compute additions/removals on drift.
                items:
                  type: integer
                type: array
              uyuniId:
                description: UyuniID is the schedule ID assigned by Uyuni.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
